<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f6f8f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f6f8f5;">
<tr>
<td align="center" style="padding:32px 16px 40px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
<tr>
<td style="padding:0 2px 18px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
<tr>
<td style="vertical-align:middle;"><img src="cid:skiff-mark@useskiff.xyz" width="30" height="30" alt="" style="display:block;border:0;border-radius:7px;"></td>
<td style="vertical-align:middle;padding-left:10px;font-family:'Bricolage Grotesque','Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;letter-spacing:-0.02em;color:#142c29;">Skiff</td>
</tr>
</table>
</td>
</tr>
<tr>
<td style="background-color:#ffffff;border:1px solid #d5dfda;border-radius:10px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td style="padding:30px 30px 10px;">
<h1 style="margin:0 0 18px;font-family:'Bricolage Grotesque','Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-0.01em;color:#12302c;">{{.Heading}}</h1>
{{range .Body}}<p style="margin:0 0 14px;font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#12302c;">{{.}}</p>
{{end}}{{if .Button}}<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0 20px;">
<tr>
<td style="background-color:#14403a;border-radius:7px;"><a href="{{.URL}}" style="display:inline-block;padding:12px 22px;font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;line-height:1;color:#f6f8f5;text-decoration:none;border-radius:7px;">{{.Button}}</a></td>
</tr>
</table>
{{end}}{{if .Note}}<p style="margin:0 0 20px;font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#4b655f;word-break:break-word;">{{.Note}}</p>
{{end}}</td>
</tr>
<tr>
<td style="padding:0 30px;"><div style="height:2px;line-height:2px;font-size:0;background-color:#a4531f;border-radius:1px;width:40px;">&nbsp;</div></td>
</tr>
<tr>
<td style="padding:14px 30px 26px;font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#4b655f;">{{if .Reason}}{{.Reason}}{{else}}Sent by Skiff.{{end}}</td>
</tr>
</table>
</td>
</tr>
<tr>
<td style="padding:16px 2px 0;font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#6f8f87;">Skiff · Small boat, your own water.</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
