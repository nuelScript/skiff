name = "code-server"
category = "Development"
blurb = "VS Code in the browser, with a terminal and your files kept on a volume."
image = "codercom/code-server:4.145.2"
port = 8080
memory = "1 GB"
timeout = 120
setup = "Sign in with the password in PASSWORD under Environment. Its terminal runs inside the app's container, not on your server."

[[volumes]]
name = "home"
path = "/home/coder"

[env]
PASSWORD = "{{secret}}"
