name = "Linkwarden"
blurb = "A bookmark manager that saves a copy of each page you keep, with a Postgres database included."
category = "Productivity"
image = "ghcr.io/linkwarden/linkwarden:v2.16.3"
database = "postgres"
database_var = "DATABASE_URL"
port = 3000
memory = "1 GB"
timeout = 300
setup = "Open it right away and sign up. Anyone can sign up until you add NEXT_PUBLIC_DISABLE_REGISTRATION=true under Environment and redeploy."

[[volumes]]
name = "data"
path = "/data/data"

[env]
DATABASE_URL = "{{db.url}}"
NEXTAUTH_URL = "{{url}}/api/v1/auth"
NEXTAUTH_SECRET = "{{secret}}"
