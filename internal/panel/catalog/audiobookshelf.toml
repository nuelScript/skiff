name = "Audiobookshelf"
category = "Media"
blurb = "Audiobooks and podcasts, streamed to the browser and the mobile apps, with your progress synced."
image = "ghcr.io/advplyr/audiobookshelf:2.37.2"
port = 80
memory = "256 MB"
timeout = 120
setup = "Open it right away and create the root user. Until you do, anyone who opens it can."

[[volumes]]
name = "config"
path = "/config"

[[volumes]]
name = "metadata"
path = "/metadata"

[[volumes]]
name = "audiobooks"
path = "/audiobooks"
