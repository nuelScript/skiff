name = "Ollama"
category = "AI"
blurb = "Open models like Llama, Qwen and Gemma on your own server, with an OpenAI-compatible API behind a key. Small models run on the CPU; a GPU makes them fast."
image = "ollama/ollama:0.40.15"
port = 11434
memory = "4 GB"
timeout = 180
access_token = true
setup = "Download a model from the project's Console, like ollama pull llama3.2. Call the API at this app's address with the key in ACCESS_TOKEN under Environment, sent as Authorization: Bearer. For OpenAI's clients, use the address followed by /v1 as the base URL and the key as the API key."

[[volumes]]
name = "models"
path = "/root/.ollama"

[env]
OLLAMA_HOST = "0.0.0.0:11434"
