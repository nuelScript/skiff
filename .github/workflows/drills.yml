name: failure drills

# Breaks a real panel, router, app and database, then checks what came back.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "e2e/drill_test.go"
      - ".github/workflows/drills.yml"

permissions:
  contents: read

jobs:
  drills:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true
      - name: crashes, bucket outage, power cut and full disk
        env:
          SKIFF_DRILLS: machine
        run: go test -tags e2e -count=1 -timeout 40m -v -run '^TestDrill' ./e2e/...
