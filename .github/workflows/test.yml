name: test

# Vet and test on every push to main and every pull request; e2e deploys a repo
# through the real binary with Docker. The dashboard is
# already embedded (internal/panel/dist is committed), so no Node build is needed
# to compile the Go packages.

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  action:
    name: action loads on a real runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: unreachable
        continue-on-error: true
        uses: ./
        with:
          server: http://127.0.0.1:1
          token: not-a-real-token
          app: nothing
      - name: The step must fail, because the server can't be reached
        run: test "${{ steps.unreachable.outcome }}" = failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l . | grep -v '^\.agents/' || true)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - run: go vet ./...

      - run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: deploy, redeploy, rollback and teardown through the real binary
        run: go test -tags e2e -count=1 -v ./e2e/...
