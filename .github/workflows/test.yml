name: test

# Vet and test on every push to main and every pull request; e2e deploys a repo
# through the real binary with Docker. The dashboard is
# already embedded (internal/panel/dist is committed), so no Node build is needed
# to compile the Go packages.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  action:
    name: action loads on a real runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: unreachable
        continue-on-error: true
        uses: ./
        with:
          server: http://127.0.0.1:1
          token: not-a-real-token
          app: nothing
      - name: The step must fail, because the server can't be reached
        run: test "${{ steps.unreachable.outcome }}" = failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l . | grep -v '^\.agents/' || true)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - run: go vet ./...

      - run: go test ./...

  # The e2e tests are independent, so they run in groups on separate runners. The groups are balanced by how long the tests took, and the last one runs everything the others don't name, so a new test always runs somewhere.
  e2e-group:
    name: e2e (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: history
            run: "^Test(CorruptHistory|PointInTimeRecovery|RestoreReturnsToBackup)"
          - name: recovery
            run: "^Test(HistorySurvivesServerLoss|DBConnect|DisasterRecovery|VolumeBackupFromBucket)"
          - name: deploys
            run: "^Test(GitDeployLifecycle|TomlWorkersAndJobs|GitHubAction|DeployLetsStreamsFinish)"
          - name: stacks
            run: "^Test(Stack|ComposeStack|PreviewData)"
          - name: agents
            run: "^TestAgentFrameworks"
          - name: rest
            skip: "^Test(AgentFrameworks|Drill|Upgrade|CorruptHistory|PointInTimeRecovery|RestoreReturnsToBackup|HistorySurvivesServerLoss|DBConnect|DisasterRecovery|VolumeBackupFromBucket|GitDeployLifecycle|TomlWorkersAndJobs|GitHubAction|DeployLetsStreamsFinish|Stack|ComposeStack|PreviewData)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true

      - name: deploy, redeploy, rollback and teardown through the real binary
        env:
          RUN: ${{ matrix.group.run }}
          SKIP: ${{ matrix.group.skip }}
        run: |
          if [ -n "$RUN" ]; then
            go test -tags e2e -count=1 -timeout 25m -v -run "$RUN" ./e2e/...
          else
            go test -tags e2e -count=1 -timeout 25m -v -skip "$SKIP" ./e2e/...
          fi

  # Branch protection asks for one check named e2e; it passes only when every group did.
  e2e:
    needs: e2e-group
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-group.result }}" = success

  upgrade:
    name: upgrades from every released minor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true

      - name: run each minor with real state, then swap in this build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go test -tags e2e -count=1 -timeout 25m -v -run '^TestUpgrade$' ./e2e/...
